
name: Deploy Chess Universe

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout versao 1
        uses: actions/checkout@v4
        with:
          ref: main
          path: version-1

      - name: Checkout versao 2
        uses: actions/checkout@v4
        with:
          ref: versao-2
          path: version-2

      - name: Checkout versao 3
        uses: actions/checkout@v4
        with:
          ref: versao-3
          path: version-3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build versao 1
        working-directory: version-1
        run: |
          npm ci
          npm run build -- --base=/Chess-Universe/versao-1/

      - name: Build versao 2
        working-directory: version-2
        run: |
          npm ci
          npm run build -- --base=/Chess-Universe/versao-2/

      - name: Build versao 3
        working-directory: version-3
        run: |
          npm ci
          npm run build -- --base=/Chess-Universe/versao-3/

      - name: Organize website
        run: |
          mkdir -p site/versao-1 site/versao-2 site/versao-3
          cp -R version-1/dist/. site/versao-1/
          cp -R version-2/dist/. site/versao-2/
          cp -R version-3/dist/. site/versao-3/

          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Chess Universe</title>
            <style>
              body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: #10131b;
                color: white;
                font-family: Arial, sans-serif;
              }
              main { text-align: center; padding: 30px; }
              h1 { font-size: 42px; }
              a {
                display: block;
                margin: 14px;
                padding: 18px 35px;
                border-radius: 12px;
                background: #252c3c;
                color: white;
                text-decoration: none;
              }
              a:hover { background: #39465f; }
            </style>
          </head>
          <body>
            <main>
              <h1>Chess Universe</h1>
              <p>Choose your version</p>
              <a href="./versao-1/">Version 1</a>
              <a href="./versao-2/">Version 2</a>
              <a href="./versao-3/">Version 3</a>
            </main>
          </body>
          </html>
          EOF

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
